[project]
name = "exact-online-mcp"
version = "0.1.0"
description = "Read-only Exact Online MCP server, deployable on foro.sh"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

# Prefills Connect on the project's Env tab. Exact runs one host per region: outside the
# Netherlands, edit both URLs there to your region's host (see the README).
[tool.foro.grants.exact]
authorization_endpoint = "https://start.exactonline.nl/api/oauth2/auth"
token_endpoint = "https://start.exactonline.nl/api/oauth2/token"
client_secret_name = "EXACT_CLIENT_SECRET"
